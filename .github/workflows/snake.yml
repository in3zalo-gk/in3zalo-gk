'name: Atualizar calendário de contribuições

on:
  schedule:
    - cron: '\''23 6 * * *'\''
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-calendar
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Gerar uma animação anual
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23d6fa67
      - name: Publicar calendário único
        shell: bash
        run: |
          mkdir -p assets
          cp dist/github-snake-dark.svg assets/github-snake-dark.svg
          git config user.name '\''github-actions[bot]'\''
          git config user.email '\''41898282+github-actions[bot]@users.noreply.github.com'\''
          git add assets/github-snake-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '\''Atualiza calendário de contribuições'\''
          git push origin HEAD:main
'name: Atualizar cobrinha de contribuições
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/enlarge_snake.py'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Gerar animações com contribuições reais
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23d6fa67
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23d6fa67
      - name: Publicar SVGs no perfil
        shell: bash
        run: |
          mkdir -p assets
          cp dist/*.svg assets/
          python3 scripts/enlarge_snake.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Atualiza cobrinha das contribuições'
          git pull --rebase origin main
          git push origin HEAD:main
