<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Cobrinha de contribuições</title><desc id="desc">Ilustração explicativa: uma cobrinha verde percorre quadrados de um calendário. Não representa dados reais de atividade.</desc><defs><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="28" height="28" rx="6" fill="#26392c"/></pattern></defs><rect width="1200" height="340" rx="24" fill="#101811"/><text x="48" y="62" fill="#d6fa67" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">CONTRIBUTION SNAKE</text><text x="48" y="112" fill="#f3f8ee" font-family="Arial,sans-serif" font-size="34" font-weight="700">Cada contribuição deixa um rastro.</text><text x="48" y="152" fill="#b7c8b4" font-family="Arial,sans-serif" font-size="20">O calendário real ganha movimento no perfil.</text><rect x="48" y="185" width="600" height="114" fill="url(#grid)"/><path d="M72 242H185V204H300V280H414V242H530" fill="none" stroke="#d6fa67" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="536" cy="237" r="3" fill="#101811"/><circle cx="536" cy="247" r="3" fill="#101811"/><text x="730" y="202" fill="#f3f8ee" font-family="Arial,sans-serif" font-size="24" font-weight="700">Calendário → animação</text><text x="730" y="240" fill="#b7c8b4" font-family="Arial,sans-serif" font-size="19">SVG automático · claro e escuro</text><text x="730" y="278" fill="#b7c8b4" font-family="Arial,sans-serif" font-size="16">Ilustração explicativa, não são dados reais.</text></svg>